openapi: 3.0.3
info:
  title: SW2026 E-commerce API
  version: 1.0.0
  description: >
    In-memory REST API for user registration, JWT login, and checkout.
    Checkout accepts only cash or credit card. Cash applies a 10% discount.
    Only authenticated users can checkout.
servers:
  - url: http://localhost:3000
    description: Local development
tags:
  - name: Auth
  - name: Checkout
  - name: Health
  - name: Docs
paths:
  /register:
    post:
      tags: [Auth]
      summary: Register a new user
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              name: Alice Cooper
              email: alice@example.com
              password: secret123
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Email already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /login:
    post:
      tags: [Auth]
      summary: Login and receive a JWT token
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: john@example.com
              password: password123
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Missing credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /checkout:
    post:
      tags: [Checkout]
      summary: Checkout products
      description: Requires a Bearer JWT. Accepts cash or credit_card. Cash applies a 10% discount.
      operationId: checkout
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutRequest'
            example:
              paymentMethod: cash
              items:
                - productId: 1
                  quantity: 1
                - productId: 2
                  quantity: 2
      responses:
        '200':
          description: Checkout completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutResponse'
        '400':
          description: Invalid payment method, items, or stock
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Product not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /healthcheck:
    get:
      tags: [Health]
      summary: Health check
      operationId: healthcheck
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /docs:
    get:
      tags: [Docs]
      summary: Interactive Swagger UI
      operationId: swaggerUi
      responses:
        '200':
          description: Swagger UI HTML page rendered from swagger.yaml
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    RegisterRequest:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 6
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    User:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
    AuthResponse:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/User'
        token:
          type: string
    CheckoutItemInput:
      type: object
      required: [productId, quantity]
      properties:
        productId:
          type: integer
        quantity:
          type: integer
          minimum: 1
    CheckoutRequest:
      type: object
      required: [items, paymentMethod]
      properties:
        paymentMethod:
          type: string
          enum: [cash, credit_card]
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/CheckoutItemInput'
    CheckoutLineItem:
      type: object
      properties:
        productId:
          type: integer
        name:
          type: string
        unitPrice:
          type: number
        quantity:
          type: integer
        subtotal:
          type: number
    CheckoutResponse:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/User'
        paymentMethod:
          type: string
          enum: [cash, credit_card]
        items:
          type: array
          items:
            $ref: '#/components/schemas/CheckoutLineItem'
        subtotal:
          type: number
        discount:
          type: number
        discountRate:
          type: number
        total:
          type: number
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: ok
        service:
          type: string
        timestamp:
          type: string
          format: date-time
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
        details: {}
